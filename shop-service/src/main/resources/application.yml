# =============================================================================
# shop-service 店铺/剧本微服务配置
# -----------------------------------------------------------------------------
# 端口: 8083
# 数据库: MySQL 3306, 库 urban_script_reservation (与 user-service 共用)
# Redis: 6379, database 1
# Nacos: 127.0.0.1:8848 (Discovery + Config)
# =============================================================================

server:
  port: 8083

spring:
  application:
    name: shop-service

  # Spring Boot 3.x Config Data API（官方推荐）：通过 import 列表直接从 Nacos 拉多个 DataId。
  # 规则：列表越靠后，属性优先级越高（能覆盖前面同名属性）。
  #   1) {appName}.yaml      — 服务专用配置（优先级最低）
  #   2) urban-shared.yaml   — 公共基础设施（MySQL/Redis 等各业务服务共用）
  #   3) urban-shared-config — 敏感配置（JWT 密钥 / 内部 API Key，最高优先级，最后加载）
  config:
    import:
      # optional: 前缀 —— Nacos 不可达时降级为本地配置，不阻塞启动（本地开发可不先起 Nacos）
      - "optional:nacos:shop-service.yaml?group=DEFAULT_GROUP&refresh=true"
      - "optional:nacos:urban-shared.yaml?group=DEFAULT_GROUP&refresh=true"
      - "optional:nacos:urban-shared-config?group=DEFAULT_GROUP&refresh=true"
  # -------------------- Cloud Nacos --------------------
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        group: DEFAULT_GROUP
        fail-fast: false
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yaml
        enabled: true
        # 配置导入校验：import 列表为空时直接报错，避免静默降级（此前靠 false 绕过了校验）
        import-check:
          enabled: true

  # -------------------- MySQL --------------------
  datasource:
    url: jdbc:mysql://localhost:3306/urban_script_reservation?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  # -------------------- Redis --------------------
  data:
    redis:
      host: localhost
      port: 6379
      database: 1
      timeout: 3000

  # -------------------- RabbitMQ --------------------
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    # 发布确认 + 返回机制 —— 确保消息不丢
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10

# -------------------- MyBatis-Plus --------------------
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: none

# -------------------- Knife4j --------------------
springdoc:
  swagger-ui:
    path: /doc.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

# -------------------- 业务自定义配置 --------------------
# 🔐 JWT 密钥：由 JwtAutoConfiguration 启动时写入 JwtUtil（reservation-common 共享 jar）。
#    取值优先级：Nacos urban-shared-config 的 jwt.secret > 环境变量 JWT_SECRET > 下方本地默认值。
#    ⚠️ 下方默认值仅供本地开发（无 Nacos、未设环境变量时）；生产必须用 Nacos 或环境变量覆盖。
jwt:
  secret: "${JWT_SECRET:dev-only-jwt-secret-override-in-production-32bytes}"
  expire-millis: ${JWT_EXPIRE_MILLIS:7200000}

# 🔐 内部接口 API Key（InternalApiKeyFilter / InternalApiKeyInterceptor）：同样优先取 Nacos
urban:
  internal-api-key: "${URBAN_INTERNAL_API_KEY:urban-internal-api-key-dev-fallback}"

# -------------------- 日志 --------------------
logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] [%thread] %logger{36} - %msg%n"
  level:
    com.urban.script.shop: DEBUG
    com.alibaba.nacos: WARN
    com.baomidou.mybatisplus: DEBUG
